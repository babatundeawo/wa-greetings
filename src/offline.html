<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'self'">
<base href="%%BASE%%">
<title>You are offline · Daily Greetings</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<script src="theme-init.js"></script>
<link rel="stylesheet" href="%%CSS%%">
</head>
<body>
<main class="auth" id="main">
  <div class="auth__card">
    <div class="auth__brand">
      <img class="auth__logo" src="icons/icon.svg" width="56" height="56" alt="">
      <h1 class="auth__title">You are offline</h1>
      <p class="auth__lead">Daily Greetings needs the internet to sign you in and load your contacts. Your contacts are never stored on this device, so there is nothing to show until you reconnect.</p>
    </div>
    <a class="btn btn--block" href="./">Try again</a>
  </div>
</main>
</body>
</html>
