<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Greetings</title>
<meta name="theme-color" content="#128C7E">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <section id="login" class="login-screen">
    <div class="login-card">
      <h1>🌿 Daily Greetings</h1>
      <p class="subtle">Sign in to continue</p>
      <form id="loginForm">
        <input id="loginEmail" type="email" placeholder="Email" autocomplete="username" required>
        <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" required>
        <button type="submit" class="send-btn">Sign in</button>
      </form>
      <p id="loginError" class="login-error"></p>
    </div>
  </section>

  <div id="app" style="display:none;">
    <header>
      <h1>🌿 Daily Greetings</h1>
      <p class="subtle">Send as many as you like, whenever you like</p>
      <button id="signOutBtn" class="link-btn light">Sign out</button>
    </header>

    <section id="controls" class="controls">
      <input id="searchInput" type="search" placeholder="Search by name…" class="search-input">

      <div id="labelFilters" class="label-filters"></div>

      <div id="viewTabs" class="view-tabs"></div>

      <div id="summary" class="summary"></div>
    </section>

    <main id="list" class="list">
      <p class="loading">Loading contacts…</p>
    </main>
  </div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
