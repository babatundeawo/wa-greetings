# Builds, checks and publishes the site to GitHub Pages.
#   - Pull requests: build and check only. Nothing is published. The built site is attached
#     to the run as a download so you can inspect it.
#   - Pushes to main (and the "Run workflow" button): build, check, then publish.
name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deployments at once. A newer pull-request run replaces an older one;
# a deployment in progress is allowed to finish.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get the code
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      # A hard stop: contact lists must live in the private database, never in this repository.
      - name: Make sure no contact data is committed
        run: |
          found="$(git ls-files | grep -Ei '(^|/)(contacts|contact-book|pending|sent|ignored)[^/]*\.(csv|json|vcf)$' || true)"
          if [ -n "$found" ]; then
            echo "::error::Contact data found in the repository. Remove these files and import contacts in the app instead:"
            echo "$found"
            exit 1
          fi

      - name: Install the build tools
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: |
          for f in src/*.js scripts/*.mjs; do
            cp "$f" /tmp/syntax-check.mjs
            node --check /tmp/syntax-check.mjs && echo "ok  $f"
          done

      # Pull-request and check builds use placeholder Firebase settings and are never published.
      - name: Build the site (check copy)
        run: node scripts/build.mjs --allow-missing-config

      - name: Check the built site
        run: node scripts/verify.mjs

      # Reports problems without failing the run, so a flaky link never blocks a deployment.
      - name: Check links
        uses: lycheeverse/lychee-action@v2.9.0
        continue-on-error: true
        with:
          args: --offline --no-progress --root-dir "${{ github.workspace }}/_site" "_site/**/*.html" README.md "docs/**/*.md"
          fail: false

      - name: Lighthouse report
        continue-on-error: true
        run: npx --yes @lhci/cli@0.15.1 autorun --config=.lighthouserc.json

      - name: Keep the Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lighthouse-report
          path: .lighthouseci
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep the built site for inspection (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: site-preview
          path: _site
          retention-days: 7

  deploy:
    name: Publish
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the code
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Read the Pages settings
        id: pages
        uses: actions/configure-pages@v6.0.0

      - name: Install the build tools
        run: npm install --no-audit --no-fund

      # Fails with a plain-English message if a required secret is missing.
      - name: Build the site
        run: node scripts/build.mjs
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}

      - name: Check the built site
        run: node scripts/verify.mjs --production

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
