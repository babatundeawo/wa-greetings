# Scans the JavaScript for common security mistakes, on every change and once a week.
# GitHub provides this free for public repositories. It is skipped on private ones
# unless GitHub Code Security is enabled for them.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Get the code
        uses: actions/checkout@v7.0.1

      - name: Set up CodeQL
        uses: github/codeql-action/init@v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4.38.2
        with:
          category: "/language:javascript-typescript"
